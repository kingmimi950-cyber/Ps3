<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>SquadLink PS3 Edition</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
  body { 
    background: #0b0f14; 
    color: #edf2f7; 
    font-family: Arial, sans-serif; 
    margin: 0; 
    padding: 15px; 
    direction: rtl; 
  }
  input, button { 
    font-size: 18px; 
    padding: 12px; 
    margin: 8px 0; 
    background: #202b37; 
    color: #fff; 
    border: 2px solid #3b82f6; 
    border-radius: 8px; 
  }
  /* إضاءة واضحة لعنصر التركيز عند الاستخدام بذراع البلاي ستيشن */
  button:focus, input:focus { 
    outline: none; 
    border-color: #fbbf24; 
    background: #1e3a8a; 
    box-shadow: 0 0 10px #fbbf24; 
  }
  .container { 
    max-width: 650px; 
    margin: 20px auto; 
    background: #111821; 
    padding: 20px; 
    border-radius: 12px; 
    border: 1px solid #293544; 
  }
  .message { 
    background: #18212c; 
    padding: 10px; 
    margin: 8px 0; 
    border-radius: 6px; 
    border-right: 5px solid #3b82f6; 
    line-height: 1.5; 
  }
  .hidden { display: none !important; }
  .btn-primary { background: #3b82f6; width: 100%; font-weight: bold; cursor: pointer; }
  .btn-danger { background: #ef4444; border-color: #ef4444; }
</style>
</head>
<body>

<div class="container" id="login-screen">
  <h2>SquadLink - نسخة البلاي ستيشن 3 🎮</h2>
  <p style="color: #8d9aaa;">أدخل بياناتك للانضمام إلى الغرفة:</p>
  <input type="text" id="username" placeholder="اسم المستخدم" style="width:100%; box-sizing:border-box;">
  <input type="text" id="room" placeholder="رمز الغرفة (مثال: SL-ABC123)" style="width:100%; box-sizing:border-box;">
  <button class="btn-primary" onclick="login()">دخول الغرفة</button>
</div>

<div class="container hidden" id="chat-screen">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
    <h3 id="room-title" style="margin:0;">الغرفة</h3>
    <button class="btn-danger" onclick="logout()" style="padding: 6px 12px; font-size: 14px;">خروج 🚪</button>
  </div>
  
  <div id="messages" style="height: 320px; overflow-y: scroll; background: #0b0f14; padding: 12px; border: 1px solid #293544; border-radius: 8px; margin-bottom: 12px;"></div>
  
  <div style="display: flex; gap: 8px;">
    <input type="text" id="msg-input" placeholder="اكتب رسالتك..." style="flex: 1; margin: 0;" onkeydown="checkEnter(event)">
    <button class="btn-primary" onclick="sendMessage()" style="width: 100px; margin: 0;">إرسال</button>
  </div>
</div>

<script>
  var firebaseConfig = { databaseURL: "https://football-game-2176c-default-rtdb.firebaseio.com" };
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  var db = firebase.database();

  var currentUser = "";
  var currentRoom = "";
  var chatPath = "";

  function login() {
    var u = document.getElementById("username").value.trim();
    var r = document.getElementById("room").value.trim();
    if (!u || !r) {
      alert("يرجى إدخال الاسم ورمز الغرفة");
      return;
    }
    currentUser = u;
    currentRoom = r;
    chatPath = "rooms/" + r + "/messages";

    document.getElementById("login-screen").classList.add("hidden");
    document.getElementById("chat-screen").classList.remove("hidden");
    document.getElementById("room-title").innerText = "غرفة: " + r;

    loadMessages();
  }

  function loadMessages() {
    db.ref(chatPath).on("value", function(snapshot) {
      var data = snapshot.val() || {};
      var box = document.getElementById("messages");
      box.innerHTML = "";
      var keys = Object.keys(data);
      
      if (keys.length === 0) {
        box.innerHTML = '<div style="color: #8d9aaa; text-align: center; padding: 20px;">لا توجد رسائل بعد.. كن أول المشاركين!</div>';
        return;
      }

      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var m = data[key];
        var div = document.createElement("div");
        div.className = "message";
        div.innerHTML = "<b style='color: #60a5fa;'>" + (m.sender || "مجهول") + ":</b> " + (m.text || "");
        box.appendChild(div);
      }
      box.scrollTop = box.scrollHeight;
    });
  }

  function sendMessage() {
    var input = document.getElementById("msg-input");
    var text = input.value.trim();
    if (!text) return;

    db.ref(chatPath).push({
      sender: currentUser,
      text: text,
      timestamp: firebase.database.ServerValue.TIMESTAMP
    }, function(error) {
      if (!error) {
        input.value = "";
      }
    });
  }

  function checkEnter(e) {
    // زر الإدخال أو زر Start/Enter في ذراع البلاي ستيشن
    if (e.keyCode === 13) {
      sendMessage();
    }
  }

  function logout() {
    location.reload();
  }
</script>
</body>
</html>
